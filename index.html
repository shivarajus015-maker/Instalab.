<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>InstaLab • Practical Science Learning</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./assets/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <script src="./app-config.js"></script>
  <style>
    :root {
      --bg-page: #ffffff;
      --surface: #ffffff;
      --surface-subtle: #f8fafb;
      --border: #e2e8f0;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;

      /* 1. Teal (#078B82) */
      --accent: #078B82;
      --accent-hover: #06736b;
      --accent-soft: rgba(7, 139, 130, 0.10);
      --accent-border: rgba(7, 139, 130, 0.30);
      --welcome-grad: linear-gradient(135deg, #05665f 0%, #078B82 55%, #0ea59b 100%);
      --chat-in-bg: #f1f8f7;
    }

    body[data-theme="blue"] {
      --accent: #2878D0;
      --accent-hover: #1f63ad;
      --accent-soft: rgba(40, 120, 208, 0.10);
      --accent-border: rgba(40, 120, 208, 0.30);
      --welcome-grad: linear-gradient(135deg, #1b5494 0%, #2878D0 55%, #4692e5 100%);
      --chat-in-bg: #f1f6fc;
    }

    body[data-theme="purple"] {
      --accent: #8054C7;
      --accent-hover: #6941aa;
      --accent-soft: rgba(128, 84, 199, 0.10);
      --accent-border: rgba(128, 84, 199, 0.30);
      --welcome-grad: linear-gradient(135deg, #56348c 0%, #8054C7 55%, #9b74dc 100%);
      --chat-in-bg: #f5f2fb;
    }

    body[data-theme="orange"] {
      --accent: #F29A35;
      --accent-hover: #d88322;
      --accent-soft: rgba(242, 154, 53, 0.12);
      --accent-border: rgba(242, 154, 53, 0.35);
      --welcome-grad: linear-gradient(135deg, #b86b14 0%, #F29A35 55%, #f6b05c 100%);
      --chat-in-bg: #fdf7ef;
    }

    body[data-theme="pink"] {
      --accent: #E75A91;
      --accent-hover: #cc467a;
      --accent-soft: rgba(231, 90, 145, 0.10);
      --accent-border: rgba(231, 90, 145, 0.30);
      --welcome-grad: linear-gradient(135deg, #a83361 0%, #E75A91 55%, #f07da9 100%);
      --chat-in-bg: #fdf2f6;
    }

    body[data-theme="bw"] {
      --accent: #202124;
      --accent-hover: #000000;
      --accent-soft: rgba(32, 33, 36, 0.08);
      --accent-border: rgba(32, 33, 36, 0.35);
      --welcome-grad: linear-gradient(135deg, #111214 0%, #202124 60%, #3c4043 100%);
      --chat-in-bg: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Kannada", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background: #ffffff !important;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }

    #appView #installBanner,
    #appView .install-banner {
      display: none !important;
    }

    .theme-dots {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .theme-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .theme-dot:hover { transform: scale(1.1); }
    .theme-dot.active {
      transform: scale(1.12);
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px var(--accent);
    }

    .lang-switch {
      display: inline-flex;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
    }

    .lang-switch button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .lang-switch button.active {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 12px 18px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }

    .btn-secondary {
      background: #ffffff;
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-danger-outline {
      background: #ffffff;
      color: #dc2626;
      border: 1px solid #fecaca;
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: #ffffff;
      border: 1.5px solid var(--border);
      color: var(--text-primary);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .form-control:disabled,
    .form-control[readonly] {
      background: var(--surface-subtle);
      color: var(--text-muted);
    }

    /* Login */
    #loginView {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 18px 16px 28px;
    }

    .login-topbar {
      width: 100%;
      max-width: 460px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .login-center {
      width: 100%;
      max-width: 440px;
      margin: auto 0;
      padding: 18px 0;
    }

    .brand-block { text-align: center; margin-bottom: 18px; }
    .brand-logo-wrap {
      width: 170px;
      height: 82px;
      margin: 0 auto 10px;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
    }
    .brand-logo-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .brand-tagline { font-size: 15.5px; font-weight: 700; color: var(--accent); margin-top: 2px; }
    .brand-intro { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    .install-banner {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 24px 20px;
      box-shadow: var(--shadow-md);
    }

    .alert-box {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
    }
    .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
    .alert-success { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }

    /* App Shell */
    #appView {
      min-height: 100vh;
      background: #ffffff;
      padding-bottom: 84px;
    }

    .app-container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .header-brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .header-logo {
      width: 96px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 4px 8px;
      object-fit: contain;
      background: #ffffff;
      flex-shrink: 0;
    }

    body[data-theme="bw"] .brand-logo-wrap,
    body[data-theme="bw"] .header-logo {
      background: #111214;
      border-color: #202124;
      border-radius: 12px;
    }

    .header-school {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }
    .header-tagline-sub {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      flex-wrap: wrap;
    }

    /* Home */
    #tabHome {
      padding: 8px 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome-card {
      width: 100%;
      background: var(--welcome-grad);
      color: #ffffff;
      border-radius: var(--radius-xl);
      padding: 26px 22px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    .welcome-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .welcome-photo-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 10px;
      border: 3px solid rgba(255, 255, 255, 0.88);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.22);
      background: rgba(255, 255, 255, 0.20);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
    }

    .welcome-photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .welcome-greeting { font-size: 24px; font-weight: 800; line-height: 1.25; margin-bottom: 4px; }
    .welcome-school-line { font-size: 14px; font-weight: 600; opacity: 0.94; margin-bottom: 14px; }
    .welcome-divider { width: 52px; height: 3px; background: rgba(255, 255, 255, 0.45); border-radius: 999px; margin: 0 auto 14px; }
    .welcome-wish-2line { font-size: 15px; font-weight: 600; line-height: 1.55; opacity: 0.98; max-width: 540px; margin: 0 auto; white-space: pre-line; }

    .today-home-card {
      background: #ffffff;
      border: 1.5px solid var(--accent-border);
      border-radius: var(--radius-xl);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .today-home-title {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .today-home-wish {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .resource-btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .res-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 12.5px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .res-btn.see { background: var(--accent); color: #ffffff; }
    .res-btn.download { background: #111827; color: #ffffff; }
    .res-btn.locked {
      background: #f3f4f6;
      color: #9ca3af;
      border: 1px solid #e5e7eb;
      cursor: not-allowed;
    }

    /* Chat Tab */
    .chat-shell {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 205px);
      min-height: 450px;
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .chat-assistant-meta { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .chat-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      border: 1.5px solid var(--accent-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      padding: 0;
    }
    .chat-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }
    .chat-name { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; display: inline-block; }
    .chat-subtitle { font-size: 12px; color: var(--text-muted); }

    .clear-chat-btn {
      background: #ffffff;
      color: #dc2626;
      border: 1px solid #fecaca;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .clear-chat-btn:hover { background: #fef2f2; }

    .chat-quick-bar {
      display: flex;
      gap: 8px;
      padding: 8px 14px;
      background: var(--surface-subtle);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .quick-chip {
      background: #ffffff;
      border: 1px solid var(--accent-border);
      color: var(--accent);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .quick-chip:hover { background: var(--accent); color: #ffffff; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #ffffff;
    }

    .msg-row { display: flex; flex-direction: column; max-width: 92%; }
    .msg-row.user { align-self: flex-end; }
    .msg-row.bot { align-self: flex-start; }

    .msg-bubble {
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-row.user .msg-bubble {
      background: var(--accent);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .msg-row.bot .msg-bubble {
      background: var(--chat-in-bg);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }
    .msg-row.user .msg-time { text-align: right; }

    .row-result-card {
      margin-top: 10px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 13px;
      padding: 12px;
    }

    .row-result-title { font-size: 14.5px; font-weight: 800; color: var(--text-primary); margin-bottom: 2px; }
    .row-result-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }

    .type-suggestions-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: var(--surface-subtle);
      border-top: 1px solid var(--border);
      overflow-x: auto;
    }

    .suggestion-chip {
      background: #ffffff;
      color: var(--text-primary);
      border: 1px solid var(--accent-border);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .suggestion-chip:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .chat-composer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #ffffff;
      border-top: 1px solid var(--border);
    }

    .chat-composer input {
      flex: 1;
      background: var(--surface-subtle);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 11px 16px;
      font-size: 14.5px;
      color: var(--text-primary);
      outline: none;
    }

    .chat-composer input:focus { background: #ffffff; border-color: var(--accent); }
    .chat-send-btn { width: 44px; height: 44px; border-radius: 50%; padding: 0; flex-shrink: 0; }

    /* Feedback Form inside Modal */
    .fb-q-item {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .fb-q-item:last-of-type { border-bottom: none; margin-bottom: 6px; }
    .fb-q-label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .fb-rating-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .fb-choice-pill {
      border: 1.5px solid var(--border);
      background: #ffffff;
      color: var(--text-secondary);
      border-radius: 9px;
      padding: 6px 11px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .fb-choice-pill.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* Profile Tab */
    .profile-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 24px 20px;
      box-shadow: var(--shadow-sm);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .profile-avatar-wrap {
      position: relative;
      width: 68px;
      height: 68px;
      flex-shrink: 0;
    }

    .profile-avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      border: 2px solid var(--accent-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .profile-photo-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .photo-btn-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .photo-mini-btn {
      background: var(--surface-subtle);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11.5px;
      font
